name: Nexus Press Auto Publisher

on:
  schedule:
    - cron: '0 * * * *'   # كل ساعة
  workflow_dispatch:
    inputs:
      count:
        description: 'عدد المقالات في هذه الدورة (اكتب 36 لأول تشغيل)'
        default: '2'
      regen_images:
        description: 'إعادة رسم الصور: none = لا / svg = استبدال الصور البديلة فقط / all = إعادة رسم كل الصور بلا علامة مائية (مرة واحدة)'
        type: choice
        default: svg
        options: [none, svg, all]

permissions:
  contents: write

concurrency:
  group: nexus-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install pillow
      - name: Install Google Gen AI SDK (github.com/googleapis/js-genai)
        run: npm install --no-save --no-package-lock @google/genai
      - name: Generate articles and build site
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # مفتاح Pollinations (يكفي أن يكون اسم السر واحداً من هذه الثلاثة)
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          # Cloudinary: إما CLOUDINARY_URL وحده، أو الأسرار الثلاثة CLOUD_NAME + API_KEY + API_SECRET
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME || vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          NP_API: ${{ vars.NP_API }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          IMAGE_PROVIDERS: ${{ vars.IMAGE_PROVIDERS || 'genai' }}
          GENAI_IMAGE_MODEL: ${{ vars.GENAI_IMAGE_MODEL }}
          MAX_PER_RUN: ${{ github.event.inputs.count || '2' }}
          REGEN_IMAGES: ${{ github.event.inputs.regen_images || 'svg' }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          ADSENSE_SLOT: ${{ vars.ADSENSE_SLOT }}
          NEWSLETTER_BUTTONDOWN: ${{ vars.NEWSLETTER_BUTTONDOWN }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python fetch_news.py
      - name: Check site (links, images, core files)
        run: python check_site.py
      - name: Commit and push (conflict-proof)
        run: |
          git config user.name "NexusPress-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "نشر تلقائي: مقالات جديدة"
          for i in 1 2 3 4; do
            git fetch origin main
            if ! git merge --no-edit -X ours origin/main; then
              # generated files (html/json/images) always win; then finish the merge
              git checkout --ours . 2>/dev/null || true
              git add -A
              git commit --no-edit -m "دمج تلقائي" || git merge --abort || true
            fi
            python3 - <<'PY'
          import json, subprocess
          try:
              mine = json.load(open("news-state.json"))["used"]
              theirs = json.loads(subprocess.check_output(["git", "show", "origin/main:news-state.json"]))["used"]
              merged = sorted(set(mine) | set(theirs))[-3000:]
              if merged != mine:
                  json.dump({"used": merged}, open("news-state.json", "w"))
          except Exception as e:
              print("state merge skipped:", e)
          PY
            git add -A
            git diff --cached --quiet || git commit -qm "دمج سجل الأخبار المستخدمة"
            if git push origin HEAD:main; then echo "pushed"; exit 0; fi
            echo "push failed, retry $i"; sleep $((i * 6))
          done
          echo "::error::could not push after 4 attempts"; exit 1

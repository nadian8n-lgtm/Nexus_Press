name: Nexus Press Auto Publisher

on:
  schedule:
    - cron: '0 * * * *' # السيرفر يعمل تلقائياً رأس كل ساعة طيلة اليوم لمواكبة الأحداث الحصرية
  workflow_dispatch: # تفعيل خيار التشغيل اليدوي بنقرة واحدة من تبويب Actions لتجربة الموقع فوراً

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # سحب كامل التاريخ البرمجي للمستودع لمنع تعارض المزامنة

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run Robot Journalist
      run: |
        # تشغيل سكريبت بايثون الصافي لتوليد وتحديث ملف البيانات المشترك بنجاح تام وبدون بلوك
        SCRIPT_PATH=$(find . -name "*fetch_news*.py" | head -n 1)
        python "$SCRIPT_PATH"

    - name: Commit and Push Updates
      run: |
        git config --global user.name "NexusPress-Bot"
        git config --global user.email "bot@nexuspress.com"
        
        git add .
        git diff-index --quiet HEAD || git commit -m "تحديث تلقائي مستقر لجريدة نكسوس بريس: ضخ المقالات وتحديث أدسينس والأدوات الحية"
        
        git pull --rebase origin main
        git push origin main

name: Publish original, corroborated news

on:
  # Hourly, five minutes past the hour (UTC). GitHub may delay scheduled starts.
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-press-news-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4.1-mini
      NEWS_MAX_AGE_HOURS: '30'
      MAX_NEW_PER_CATEGORY: '1'
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip feedparser requests

      - name: Discover, corroborate, edit, and publish
        run: python fetch_news.py

      - name: Commit and push published news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-data.json news-ar_*.html news-images/
          if git diff --cached --quiet; then
            echo "No new corroborated story passed editorial checks."
            exit 0
          fi
          git commit -m "Publish original corroborated news"
          git push origin HEAD:${GITHUB_REF_NAME}

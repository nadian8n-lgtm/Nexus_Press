name: Publish original news hourly

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-press-news-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4.1-mini
      NEWS_MAX_AGE_HOURS: '24'
      MAX_ARTICLES_PER_CATEGORY: '2'
      MAX_TOTAL_ARTICLES: '100'
      GENERATE_AI_IMAGES: 'true'

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser requests

      - name: Check required secret and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "Missing Actions secret OPENAI_API_KEY" >&2
            exit 1
          fi
          python -m py_compile fetch_news.py

      - name: Fetch and publish eligible original articles
        run: python fetch_news.py

      - name: Stage generated files without unmatched globs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new eligible stories."
            exit 0
          fi
          git commit -m "Publish unique source-linked news"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

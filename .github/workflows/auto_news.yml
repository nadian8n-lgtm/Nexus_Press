name: Publish Nexus Press news

on:
  workflow_dispatch:
  schedule:
    - cron: '5 * * * *'

permissions:
  contents: write

concurrency:
  group: nexus-press-news-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4.1-mini
      NEWS_MAX_AGE_HOURS: '48'
      MAX_ARTICLES_PER_CATEGORY: '3'
      MAX_TOTAL_ARTICLES: '100'
      GENERATE_AI_IMAGES: 'true'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser requests
      - name: Validate secret and script
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "Required Actions secret OPENAI_API_KEY is missing." >&2
            exit 1
          fi
          python -m py_compile fetch_news.py
      - name: Generate articles and original illustrations
        run: python fetch_news.py
      - name: Commit generated site content
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new eligible articles; nothing to commit."
            exit 0
          fi
          git commit -m "Publish source-linked news articles and illustrations"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

name: Nexus Press Auto Publisher

on:
  schedule:
    - cron: '0 * * * *'   # كل ساعة
  workflow_dispatch:
    inputs:
      count:
        description: 'عدد المقالات في هذه الدورة (اكتب 36 لأول تشغيل)'
        default: '2'

permissions:
  contents: write

concurrency:
  group: nexus-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Generate articles and build site
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          MAX_PER_RUN: ${{ github.event.inputs.count || '2' }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python fetch_news.py
      - name: Commit and push
        run: |
          git config user.name "NexusPress-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "نشر تلقائي: مقالات جديدة"
          git pull --rebase origin main
          git push origin main

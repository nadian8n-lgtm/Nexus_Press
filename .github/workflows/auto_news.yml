name: Nexus Press Auto Publisher

on:
  schedule:
    - cron: '0 */6 * * *' # يعمل تلقائياً كل 6 ساعات لمواكبة الحدث أولاً بأول
  workflow_dispatch: # يتيح لك تشغيله يدوياً بضغطة زر في أي وقت

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0 # جلب كامل التاريخ لمنع تعارض الـ Pull والمزامنة

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        pip install feedparser

    - name: Run Robot Journalist
      run: |
        # البحث الديناميكي عن ملف البوت وتشغيله بكفاءة
        SCRIPT_PATH=$(find . -name "*fetch_news*.py" | head -n 1)
        python "$SCRIPT_PATH"

    - name: Commit and Push Updates
      run: |
        git config --global user.name "NexusPress-Bot"
        git config --global user.email "bot@nexuspress.com"
        
        # 1. عمل حفظ (Commit) للمقالات المحدثة أولاً لتفريغ الـ Index
        git add .
        git diff-index --quiet HEAD || git commit -m "تحديث تلقائي: صياغة ونشر آخر الأخبار المتنوعة من هسبريس والمصادر العالمية"
        
        # 2. عمل المزامنة الآمنة بعد الـ Commit لدمج ملفات جوجل والملفات القانونية تلقائياً
        git pull --rebase origin main
        
        # 3. رفع التحديثات النهائية على مستودعك الخاص
        git push origin main

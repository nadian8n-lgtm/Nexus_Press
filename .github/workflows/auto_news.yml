name: Nexus Press Auto Publisher

on:
  schedule:
    - cron: '0 * * * *' # يعمل تلقائياً على رأس كل ساعة طيلة الـ 24 ساعة بدون توقف
  workflow_dispatch: # يتيح لك تشغيل البوت يدوياً بضغطة زر واحدة في أي وقت

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0 # جلب كامل التاريخ لمنع تعارض المزامنة نهائياً

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        # تثبيت المكتبات اللازمة لجلب الأخبار وتوليد الصور عبر الذكاء الاصطناعي
        pip install feedparser requests

    - name: Run Robot Journalist
      run: |
        # البحث الديناميكي وتشغيل البوت المحدث لضضخ المقالات بالصور
        SCRIPT_PATH=$(find . -name "*fetch_news*.py" | head -n 1)
        python "$SCRIPT_PATH"

    - name: Commit and Push Updates
      run: |
        git config --global user.name "NexusPress-Bot"
        git config --global user.email "bot@nexuspress.com"
        
        # 1. حفظ التقارير الـ 24 المحدثة والمنظمة بالصور في مستودعك
        git add .
        git diff-index --quiet HEAD || git commit -m "تحديث تلقائي رأس الساعة: صياغة ونشر آخر الأخبار والتحليلات لجريدة نكسوس بريس"
        
        # 2. المزامنة الآمنة لمنع التعارض مع ملف جوجل والصفحات القانونية بالفوتر
        git pull --rebase origin main
        
        # 3. رفع التحديثات النهائية لتظهر مباشرة وبأعلى سرعة على رابط موقعك
        git push origin main

concurrency:
  group: nexus-press-auto-publisher-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        ref: main
        fetch-depth: 0

    # أبقِ خطوات إعداد Python وتشغيل الصحفي الآلي كما هي

    - name: Commit and Push Updates
      run: |
        git config --global user.name "NexusPress-Bot"
        git config --global user.email "bot@nexuspress.com"
        git add .
        if ! git diff --cached --quiet; then
          git commit -m "تحديث تلقائي: نشر آخر الأخبار والتريندات الراهنة"
        fi
        git fetch origin main
        git rebase origin/main
        git push origin HEAD:main

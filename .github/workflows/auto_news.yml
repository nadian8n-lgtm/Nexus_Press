name: Nexus Press Auto Publisher

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        pip install feedparser

    - name: Run Robot Journalist
      run: |
        # Recherche dynamique et exécution du fichier contenant 'fetch_news'
        SCRIPT_PATH=$(find . -name "*fetch_news*.py" | head -n 1)
        echo "Script trouvé à l'emplacement : $SCRIPT_PATH"
        python "$SCRIPT_PATH"

    - name: Commit and Push Updates
      run: |
        git config --global user.name "NexusPress-Bot"
        git config --global user.email "bot@nexuspress.com"
        git add .
        git diff-index --quiet HEAD || git commit -m "تحديث تلقائي: نشر آخر الأخبار والتريندات الراهنة"
        git push

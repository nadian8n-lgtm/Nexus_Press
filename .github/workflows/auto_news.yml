name: Prepare hourly news drafts for editorial review

on:
  # Runs hourly at minute 5 UTC; scheduled jobs can be delayed by GitHub.
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-press-news-drafts
  cancel-in-progress: false

jobs:
  prepare-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4.1-mini
      NEWS_MAX_AGE_HOURS: '36'
      MAX_DRAFTS_PER_CATEGORY: '2'
      DRAFT_OUTPUT_DIR: ${{ runner.temp }}/nexus-press-drafts
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip feedparser requests

      - name: Discover sources and prepare unpublished drafts
        run: python fetch_news.py

      - name: Persist deduplication state only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-state.json
          if git diff --cached --quiet; then
            echo "No draft state changes."
            exit 0
          fi
          git commit -m "Update editorial draft discovery state"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload drafts for editorial review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-press-drafts-${{ github.run_number }}
          path: ${{ runner.temp }}/nexus-press-drafts/
          if-no-files-found: warn
          retention-days: 7

name: Nexus Press Auto Publisher

on:
  schedule:
    - cron: '0 * * * *' # السيرفر يستيقظ ويعمل تلقائياً رأس كل ساعة طيلة الـ 24 ساعة بدون انقطاع
  workflow_dispatch: # زر التشغيل اليدوي المباشر بنقرة واحدة داخل الـ Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0 # سحب كامل التاريخ البرمجي للمستودع لمنع أي تعارض أثناء الرفع الميكانيكي

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        # تثبيت المكتبات الحاكمة لبناء المقالات وسحب مصفوفات الصور الفوتوغرافية للويب
        pip install feedparser requests

    - name: Run Robot Journalist
      run: |
        # الكشف التلقائي الآمن عن ملف الروبوت التحريري وتشغيله لبناء وتحديث صفحات المقالات الـ 36
        SCRIPT_PATH=$(find . -name "*fetch_news*.py" | head -n 1)
        python "$SCRIPT_PATH"

    - name: Commit and Push Updates
      run: |
        git config --global user.name "NexusPress-Bot"
        git config --global user.email "bot@nexuspress.com"
        
        # 1. حفظ المقالات المنوعة كلياً، وتحديثات الأدوات التفاعلية وملف الأندكس بمسارات التوجيه الجديدة
        git add .
        git diff-index --quiet HEAD || git commit -m "تحديث تلقائي مستقر لجريدة نكسوس بريس: ضخ المقالات وتحديث الأدوات الحية رأس الساعة"
        
        # 2. المزامنة الآمنة المانعة لتعارض الـ Git Rebase مع ملفات أدسينس وصفحات الخصوصية بالفوتر
        git pull --rebase origin main
        
        # 3. دفع التحديثات مباشرة لتنشيط الموقع الإلكتروني على شبكة الويب العالمية فوراً
        git push origin main

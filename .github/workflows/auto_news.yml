- name: Commit and push published articles
  shell: bash
  run: |
    set -euo pipefail
    git config user.name "github-actions[bot]"
    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    git add -A

    if git diff --cached --quiet; then
      echo "No new eligible stories to publish."
      exit 0
    fi

    git commit -m "Publish original source-linked news"
    git push origin HEAD:main

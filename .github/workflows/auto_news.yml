name: Publish Nexus Press news

on:
  workflow_dispatch:
  schedule:
    - cron: '5 * * * *'

permissions:
  contents: write

concurrency:
  group: nexus-press-news-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4.1-mini
      NEWS_MAX_AGE_HOURS: '48'
      MAX_ARTICLES_PER_CATEGORY: '3'
      MAX_TOTAL_ARTICLES: '100'
      GENERATE_AI_IMAGES: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser requests
      - name: Validate secret and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "Required Actions secret OPENAI_API_KEY is missing." >&2
            exit 1
          fi
          python - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path('fetch_news.py').read_text(encoding='utf-8'))
          print('fetch_news.py syntax OK')
          PY
      - name: Generate articles and illustrations
        run: python fetch_news.py
      - name: Verify published data and article targets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          items=json.loads(Path('news-data.json').read_text(encoding='utf-8'))
          if not isinstance(items,list): raise SystemExit('news-data.json must be an array')
          missing=[x.get('url','?') for x in items if not Path(x.get('url','').removeprefix('./')).is_file()]
          if missing: raise SystemExit('Missing article pages: '+', '.join(missing))
          print(f'Validated {len(items)} indexed articles and all article pages.')
          PY
      - name: Commit only when site files changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- news-data.json news-state.json article-*.html news-ar_*.html news-images
          if git diff --cached --quiet; then
            echo "No new eligible stories. Existing articles are preserved."
            exit 0
          fi
          git commit -m "Publish source-linked articles and illustrations"
          git push origin HEAD:main

name: Publish Nexus Press news

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: python -m pip install --upgrade pip feedparser requests
      - name: Generate articles and homepage data
        run: python fetch_news.py
      - name: Commit and push generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-data.json news-ar_*.html
          if git diff --cached --quiet; then
            echo "No news updates to publish."
            exit 0
          fi
          git commit -m "Update news articles"
          git push

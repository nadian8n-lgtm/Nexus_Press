name: Nexus Press Auto Publisher

on:
  schedule:
    - cron: '0 */6 * * *' # يعمل تلقائياً كل 6 ساعات لمواكبة الحدث أولاً بأول
  workflow_dispatch: # يتيح لك تشغيله يدوياً بضغطة زر في أي وقت

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0 # جلب كامل التاريخ لمنع تعارض الـ Pull

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        pip install feedparser

    - name: Run Robot Journalist
      run: |
        # تشغيل السكريبت بشكل آمن وديناميكي أينما كان بالمستودع
        SCRIPT_PATH=$(find . -name "*fetch_news*.py" | head -n 1)
        python "$SCRIPT_PATH"

    - name: Commit and Push Updates
      run: |
        git config --global user.name "NexusPress-Bot"
        git config --global user.email "bot@nexuspress.com"
        git add .
        # عمل مزامنة ذكية مسبقة لمنع أي تعارض مع ملف جوجل الإثباتي
        git pull --rebase origin main
        git diff-index --quiet HEAD || git commit -m "تحديث تلقائي: نشر آخر الأخبار والتريندات الراهنة"
        git push origin main

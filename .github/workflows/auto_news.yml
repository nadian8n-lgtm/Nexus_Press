name: Nexus Press Auto Publisher

on:
  schedule:
    - cron: '0 * * * *' # السيرفر يستيقظ تلقائياً على رأس كل ساعة طيلة الـ 24 ساعة لمواكبة الحدث
  workflow_dispatch: # يتيح لك تشغيله يدوياً بضغطة زر في أي وقت

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0 # جلب كامل التاريخ لمنع تعارض المزامنة نهائياً

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        pip install feedparser

    - name: Run Robot Journalist
      run: |
        # البحث الديناميكي عن ملف البوت وتشغيله بكفاءة
        SCRIPT_PATH=$(find . -name "*fetch_news*.py" | head -n 1)
        python "$SCRIPT_PATH"

    - name: Commit and Push Updates
      run: |
        git config --global user.name "NexusPress-Bot"
        git config --global user.email "bot@nexuspress.com"
        
        # 1. عمل حفظ (Commit) للمقالات الـ 24 المحدثة لتفريغ الـ Index
        git add .
        git diff-index --quiet HEAD || git commit -m "تحديث تلقائي رأس الساعة: صياغة ونشر آخر الأخبار والتحليلات لجريدة نكسوس بريس"
        
        # 2. المزامنة الآمنة بعد الـ Commit لدمج ملفات جوجل والملفات القانونية تلقائياً ومنع التعارض
        git pull --rebase origin main
        
        # 3. رفع التحديثات النهائية على مستودعك الخاص لتحديث الجريدة فوراً
        git push origin main

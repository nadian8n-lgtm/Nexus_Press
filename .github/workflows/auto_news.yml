name: Nexus Press Auto Publisher

on:
  schedule:
    - cron: '0 * * * *' # Le serveur s'exécute automatiquement au début de chaque heure (24h/24)
  workflow_dispatch: # Permet de lancer le robot manuellement en 1 clic depuis l'onglet Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0 # Récupère tout l'historique pour éviter les erreurs de synchronisation avec la branche principale

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        # Installation des paquets requis pour l'analyse des flux et les requêtes d'images IA
        pip install feedparser requests

    - name: Run Robot Journalist
      run: |
        # Recherche dynamique et exécution du script de génération d'articles
        SCRIPT_PATH=$(find . -name "*fetch_news*.py" | head -n 1)
        python "$SCRIPT_PATH"
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # Liaison sécurisée avec votre clé secrète OpenAI

    - name: Commit and Push Updates
      run: |
        git config --global user.name "NexusPress-Bot"
        git config --global user.email "bot@nexuspress.com"
        
        # 1. Indexation et enregistrement des 42 articles générés, des images et des widgets mis à jour
        git add .
        git diff-index --quiet HEAD || git commit -m "Mise à jour horaire automatique : Génération et publication des analyses exclusives"
        
        # 2. Synchronisation sécurisée pour fusionner les fichiers légaux et de validation sans rejet
        git pull --rebase origin main
        
        # 3. Déploiement immédiat et envoi des fichiers sur GitHub Pages
        git push origin main

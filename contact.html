<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اتصل بنا | Nexus Press</title>
  <meta name="description" content="تواصل مع فريق نكسوس بريس للاستفسارات، التعاون، والإعلانات.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #071c35;
      --blue: #0b3c7a;
      --page: #f3f6fa;
      --white: #ffffff;
      --muted: #5b697a;
      --line: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      font-family: "Cairo", sans-serif;
      color: var(--navy);
      padding: 40px 20px;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
      background: var(--white);
      border: 1px solid var(--line);
      border-top: 5px solid var(--blue);
      border-radius: 16px;
      padding: clamp(24px, 5vw, 42px);
      box-shadow: 0 10px 30px rgba(7, 28, 53, 0.05);
    }
    .brand {
      text-align: center;
      padding-bottom: 18px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }
    .brand img {
      display: block;
      width: auto;
      height: 72px;
      margin: 0 auto 12px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      color: var(--blue);
    }
    p {
      color: var(--muted);
      line-height: 1.9;
      margin: 0 0 20px;
      text-align: justify;
    }
    .form-block {
      display: grid;
      gap: 16px;
    }
    .field {
      display: grid;
      gap: 8px;
    }
    label {
      font-weight: 700;
      color: var(--navy);
    }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      font: inherit;
      background: #f9fbfd;
      color: var(--navy);
    }
    input:focus, textarea:focus {
      outline: 2px solid rgba(11, 60, 122, 0.15);
      border-color: var(--blue);
      background: var(--white);
    }
    textarea { min-height: 140px; resize: vertical; }
    .btn {
      border: 0;
      background: var(--blue);
      color: var(--white);
      padding: 12px 18px;
      border-radius: 10px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:hover { background: var(--navy); }
    .link-row {
      margin-top: 22px;
      text-align: center;
    }
    .link-row a {
      color: var(--blue);
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <img src="./image_MUwSAA.png" alt="Nexus Press">
      <h1>اتصل بنا</h1>
    </div>

    <p>يسعدنا استقبال أسئلتكم ومقترحاتكم، سواء كان ذلك بشأن التعاون، الإعلان، أو أي استفسار متعلق بالمحتوى الذي نقدمـه.</p>

    <form class="form-block" onsubmit="event.preventDefault(); alert('تم إرسال رسالتك بنجاح. سنقوم بالتواصل معك في أقرب وقت.'); this.reset();">
      <div class="field">
        <label for="name">الاسم الكامل</label>
        <input id="name" type="text" placeholder="اكتب اسمك الكامل" required>
      </div>

      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" placeholder="example@mail.com" required>
      </div>

      <div class="field">
        <label for="subject">عنوان الرسالة</label>
        <input id="subject" type="text" placeholder="موضوع الرسالة" required>
      </div>

      <div class="field">
        <label for="message">نص الرسالة</label>
        <textarea id="message" placeholder="اكتب رسالتك هنا..." required></textarea>
      </div>

      <button type="submit" class="btn">إرسال الرسالة</button>
    </form>

    <div class="link-row">
      <a href="./index.html">العودة إلى الصفحة الرئيسية</a>
    </div>
  </div>
</body>
</html>

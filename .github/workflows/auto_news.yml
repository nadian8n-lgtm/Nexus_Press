name: Nexus Press Auto Publisher

on:
  schedule:
    - cron: '0 * * * *' # السيرفر يعمل تلقائياً كل ساعة على مدار الـ 24 ساعة لمواكبة الأنباء
  workflow_dispatch: # يتيح التشغيل اليدوي الفوري بضغطة زر

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        pip install feedparser

    - name: Run Robot Journalist
      run: |
        SCRIPT_PATH=$(find . -name "*fetch_news*.py" | head -n 1)
        python "$SCRIPT_PATH"

    - name: Commit and Push Updates
      run: |
        git config --global user.name "NexusPress-Bot"
        git config --global user.email "bot@nexuspress.com"
        
        # 1. تثبيت وحفظ ملفات المقالات الـ 24 المحدثة
        git add .
        git diff-index --quiet HEAD || git commit -m "تحديث تلقائي رأس الساعة: صياغة ونشر آخر الأخبار والتحليلات لجريدة نكسوس بريس"
        
        # 2. الدمج والمزامنة مع ملف إثبات جوجل تلقائياً
        git pull --rebase origin main
        
        # 3. رفع الأكواد لتحديث الموقع المباشر فوراً
        git push origin main

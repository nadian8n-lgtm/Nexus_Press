<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصفحة غير موجودة | Nexus Press</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #071c35;
      --blue: #0b3c7a;
      --page: #f3f6fa;
      --white: #ffffff;
      --muted: #5b697a;
      --line: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Cairo", sans-serif;
      background: var(--page);
      color: var(--navy);
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .box {
      width: min(720px, 100%);
      background: var(--white);
      border: 1px solid var(--line);
      border-top: 5px solid var(--blue);
      border-radius: 14px;
      padding: clamp(24px, 5vw, 48px);
      text-align: center;
      box-shadow: 0 10px 30px rgba(7, 28, 53, 0.08);
    }
    .code {
      font-size: clamp(4rem, 10vw, 7rem);
      font-weight: 800;
      line-height: 1;
      color: var(--blue);
      margin: 0 0 18px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.7rem, 4vw, 2.6rem);
    }
    p {
      margin: 0 0 26px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.8;
    }
    .btn {
      display: inline-block;
      padding: 12px 22px;
      background: var(--blue);
      color: var(--white);
      text-decoration: none;
      border-radius: 10px;
      font-weight: 700;
    }
    .btn:hover { background: var(--navy); }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>عذراً، هذه الصفحة غير موجودة</h1>
    <p>قد يكون الرابط الذي تم فتحه قديمًا أو تم تغييره. يمكنك العودة إلى الصفحة الرئيسية ومتابعة آخر الأخبار.</p>
    <a href="./index.html" class="btn">العودة إلى الرئيسية</a>
  </div>
</body>
</html>

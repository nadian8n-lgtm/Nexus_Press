name: Prepare hourly news drafts for editorial review

on:
  # GitHub Actions uses UTC and may delay scheduled starts during busy periods.
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-press-news-drafts
  cancel-in-progress: false

jobs:
  prepare-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4.1-mini
      NEWS_MAX_AGE_HOURS: '36'
      MAX_DRAFTS_PER_CATEGORY: '2'
      DRAFT_OUTPUT_DIR: ${{ runner.temp }}/nexus-press-drafts

    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser requests

      - name: Verify secret and fail-closed draft generator
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY}" ]]; then
            echo "Required repository Actions secret OPENAI_API_KEY is missing." >&2
            exit 1
          fi
          # Refuse to execute a legacy script that may write generated articles to the public site.
          python - <<'PY'
          from pathlib import Path
          source = Path("fetch_news.py").read_text(encoding="utf-8")
          required_markers = ("DRAFT_OUTPUT_DIR", "publication_status", "No article was written to the public site")
          missing = [marker for marker in required_markers if marker not in source]
          if missing:
              raise SystemExit(
                  "Unsafe or incompatible fetch_news.py; refusing to run. Missing draft-only safeguards: "
                  + ", ".join(missing)
              )
          for required in ("editorial_guard.py", "NEWS_PUBLISHING.md"):
              if not Path(required).is_file():
                  raise SystemExit(f"Required review file is missing: {required}")
          PY

      - name: Check Python syntax
        run: python -m py_compile fetch_news.py editorial_guard.py

      - name: Prepare unpublished drafts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DRAFT_OUTPUT_DIR"
          python fetch_news.py
          python editorial_guard.py

      - name: Ensure the generator did not modify public site files
        shell: bash
        run: |
          set -euo pipefail
          unexpected=$(git status --porcelain --untracked-files=all | grep -vE '^[ MARCUD?!]{2} news-state\.json$' || true)
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected repository changes detected. Refusing to commit or publish:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Persist deduplication state only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- news-state.json
          if git diff --cached --quiet; then
            echo "No draft discovery state changes."
            exit 0
          fi
          git commit -m "Update editorial draft discovery state"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload drafts and review checklist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-press-editorial-review-${{ github.run_number }}
          path: ${{ runner.temp }}/nexus-press-drafts/
          if-no-files-found: warn
          retention-days: 7

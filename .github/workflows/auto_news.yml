name: Nexus Press Auto Publisher

on:
  schedule:
    - cron: '0 * * * *' # تشغيل ميكانيكي تلقائي رأس كل ساعة طيلة اليوم لمواكبة الحدث الفوري
  workflow_dispatch: # تفعيل خيار التشغيل اليدوي بنقرة واحدة في أي وقت

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0 # سحب كامل التاريخ البرمجي للمستودع لمنع تعارض الـ Git Rebase

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        pip install feedparser requests

    - name: Run Robot Journalist
      run: |
        # الكشف عن ملف الروبوت التحريري وتشغيله لبناء وتوليد وتحديث الـ 36 مقالاً المحدثة بالكامل
        SCRIPT_PATH=$(find . -name "*fetch_news*.py" | head -n 1)
        python "$SCRIPT_PATH"

    - name: Commit and Push Updates
      run: |
        git config --global user.name "NexusPress-Bot"
        git config --global user.email "bot@nexuspress.com"
        
        git add .
        git diff-index --quiet HEAD || git commit -m "تحديث تلقائي مستقر لجريدة نكسوس بريس: ضخ المقالات وتحديث أدسينس والأدوات التفاعلية"
        
        git pull --rebase origin main
        git push origin main

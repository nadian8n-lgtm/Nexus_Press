name: Nexus Press Auto Publisher

on:
  schedule:
    - cron: '0 * * * *' # يعمل ميكانيكياً رأس كل ساعة طيلة الـ 24 ساعة دون توقف لمواكبة الأنباء
  workflow_dispatch: # تفعيل خيار زر التشغيل اليدوي بنقرة واحدة لتجربة المنصة فوراً

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run Core Clean Validation
      run: |
        python fetch_news.py

    - name: Commit and Push Updates
      run: |
        git config --global user.name "NexusPress-Bot"
        git config --global user.email "bot@nexuspress.com"
        git add .
        git diff-index --quiet HEAD || git commit -m "مزامنة سحابية مستقرة وشاملة 100%"
        git pull --rebase origin main
        git push origin main

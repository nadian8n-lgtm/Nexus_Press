name: Nexus Press Auto Publisher

on:
  schedule:
    - cron: '0 * * * *' # يعمل تلقائياً على رأس كل ساعة طيلة الـ 24 ساعة دون توقف
  workflow_dispatch: # زر التشغيل اليدوي المباشر بنقرة واحدة داخل الـ Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0 # جلب كامل التاريخ البرمجي للمستودع لمنع تعارض الـ Rebase

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Run Robot Journalist
      run: |
        # تشغيل سكريبت بايثون النظيف لتوليد ملف المقالات المشترك بنجاح تام
        SCRIPT_PATH=$(find . -name "*fetch_news*.py" | head -n 1)
        python "$SCRIPT_PATH"

    - name: Commit and Push Updates
      run: |
        git config --global user.name "NexusPress-Bot"
        git config --global user.email "bot@nexuspress.com"
        
        git add .
        git diff-index --quiet HEAD || git commit -m "تحديث تلقائي مستقر لجريدة نكسوس بريس: ضخ المقالات وتحديث البيانات الحية"
        
        git pull --rebase origin main
        git push origin main

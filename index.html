<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071c35">
  <title>نكسوس بريس | الأخبار الوطنية والدولية والاقتصاد والرياضة</title>
  <meta name="description" content="نكسوس بريس: متابعة الأخبار الوطنية والدولية والاقتصادية والرياضية باللغة العربية.">
  <link rel="canonical" href="https://nadian8n-lgtm.github.io/Nexus_Press/">
  <link rel="icon" href="./image_MUwSAA.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./index.html" aria-label="نكسوس بريس - الصفحة الرئيسية">
        <img src="./image_MUwSAA.png" alt="نكسوس بريس" onerror="this.hidden=true">
        <span>نكسوس بريس</span>
      </a>
      <p class="header-note">أخبار ومتابعة من مصادرها</p>
    </div>
  </header>
  <nav class="site-nav" aria-label="التنقل بين الأقسام">
    <div class="container nav-inner">
      <a class="nav-link is-active" href="#" data-filter="all">الرئيسية</a>
      <a class="nav-link" href="#" data-filter="ar_local">أخبار وطنية</a>
      <a class="nav-link" href="#" data-filter="ar_world">أخبار دولية</a>
      <a class="nav-link" href="#" data-filter="ar_economy">اقتصاد</a>
      <a class="nav-link" href="#" data-filter="ar_sports">رياضة</a>
    </div>
  </nav>
  <main class="container main-content">
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">الخبر أولاً</p>
      <h1 id="page-title">آخر المستجدات</h1>
      <p>اختر قسماً لمتابعة الأخبار، أو تصفح أحدث المواد المنشورة.</p>
    </section>
    <div id="status" class="status" role="status" aria-live="polite">جارٍ تحميل الأخبار…</div>
    <section id="news-grid" class="news-grid" aria-label="الأخبار"></section>
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© <span id="year"></span> نكسوس بريس</span>
      <a href="./about.html">من نحن</a>
      <a href="./contact.html">اتصل بنا</a>
      <a href="./privacy-policy.html">سياسة الخصوصية</a>
    </div>
  </footer>
  <script>
    (() => {
      const grid = document.getElementById('news-grid');
      const status = document.getElementById('status');
      const links = [...document.querySelectorAll('[data-filter]')];
      let stories = [];
      let activeFilter = 'all';
      document.getElementById('year').textContent = new Date().getFullYear();

      function render() {
        const visible = stories.filter(item => activeFilter === 'all' || item.category === activeFilter);
        grid.replaceChildren();
        visible.forEach(item => {
          const card = document.createElement('article');
          card.className = 'news-card';
          const link = document.createElement('a');
          link.className = 'card-link';
          link.href = item.url;
          const image = document.createElement('img');
          image.className = 'card-image';
          image.src = item.image || './placeholder.svg';
          image.alt = '';
          image.loading = 'lazy';
          image.onerror = () => { image.onerror = null; image.src = './placeholder.svg'; };
          const body = document.createElement('div');
          body.className = 'card-body';
          const category = document.createElement('span');
          category.className = 'badge';
          category.textContent = item.categoryLabel || 'أخبار';
          const title = document.createElement('h2');
          title.textContent = item.title || 'خبر جديد';
          const meta = document.createElement('p');
          meta.className = 'card-meta';
          meta.textContent = [item.published, item.source].filter(Boolean).join(' · ');
          body.append(category, title, meta);
          link.append(image, body);
          card.append(link);
          grid.append(card);
        });
        status.hidden = visible.length > 0;
        status.textContent = stories.length ? 'لا توجد أخبار في هذا القسم حالياً.' : 'لا توجد أخبار منشورة حالياً. يرجى المحاولة لاحقاً.';
      }

      links.forEach(link => link.addEventListener('click', event => {
        event.preventDefault();
        activeFilter = link.dataset.filter;
        links.forEach(item => item.classList.toggle('is-active', item === link));
        render();
        document.getElementById('page-title').textContent = activeFilter === 'all' ? 'آخر المستجدات' : link.textContent.trim();
      }));

      fetch('./news-data.json', { cache: 'no-store' })
        .then(response => { if (!response.ok) throw new Error('تعذر تحميل الأخبار'); return response.json(); })
        .then(data => { stories = Array.isArray(data) ? data : []; render(); })
        .catch(() => { stories = []; render(); });
    })();
  </script>
</body>
</html>

name: Nexus Press Auto Publisher

on:
  schedule:
    - cron: '0 * * * *' # Vérification et publication automatique à chaque heure (24h/24)
  workflow_dispatch: # Permet de lancer le robot manuellement en 1 clic

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0 # Récupère tout l'historique pour éviter les erreurs de synchronisation

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        pip install feedparser

    - name: Run Robot Journalist
      run: |
        SCRIPT_PATH=$(find . -name "*fetch_news*.py" | head -n 1)
        python "$SCRIPT_PATH"

    - name: Commit and Push Updates
      run: |
        git config --global user.name "NexusPress-Bot"
        git config --global user.email "bot@nexuspress.com"
        
        # 1. Sauvegarder les 24 articles générés avec leurs images
        git add .
        git diff-index --quiet HEAD || git commit -m "Tâche horaire : Publication des analyses et mise à jour de la grille"
        
        # 2. Fusion sécurisée avec le fichier Google et les pages légales
        git pull --rebase origin main
        
        # 3. Déploiement immédiat du site mis à jour
        git push origin main

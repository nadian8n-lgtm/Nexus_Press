name: Nexus Press Auto Publisher

on:
  schedule:
    - cron: '0 * * * *' # يعمل تلقائياً على رأس كل ساعة طيلة الـ 24 ساعة بدون توقف لمواكبة الحدث الفوري
  workflow_dispatch: # يتيح لك تشغيل البوت يدوياً بضغطة زر واحدة في أي وقت من لوحة التحكم

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0 # جلب كامل التاريخ البرمجي للمستودع لمنع تعارض المزامنة التلقائية نهائياً

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        # تثبيت كافة المكتبات الأساسية لضمان قراءة الأخبار وتوليد تعليقات وصور المقالات
        pip install feedparser requests

    - name: Run Robot Journalist
      run: |
        # البحث الديناميكي الآمن عن ملف البوت التحريري وتشغيله بأعلى كفاءة لضخ المقالات
        SCRIPT_PATH=$(find . -name "*fetch_news*.py" | head -n 1)
        python "$SCRIPT_PATH"

    - name: Commit and Push Updates
      run: |
        git config --global user.name "NexusPress-Bot"
        git config --global user.email "bot@nexuspress.com"
        
        # 1. حفظ المقالات الـ 24 المحدثة والمنظمة بالصور مع نظام تعليقات الزوار وتفريغ الـ Index
        git add .
        git diff-index --quiet HEAD || git commit -m "تحديث تلقائي رأس الساعة: صياغة ونشر آخر الأخبار والتحليلات لجريدة نكسوس بريس"
        
        # 2. المزامنة الآمنة والجذرية بعد الـ Commit لدمج ملفات جوجل والملفات القانونية تلقائياً ومنع التعارض
        git pull --rebase origin main
        
        # 3. رفع التحديثات النهائية لتظهر مباشرة وبأعلى سرعة على رابط موقعك العالمي
        git push origin main

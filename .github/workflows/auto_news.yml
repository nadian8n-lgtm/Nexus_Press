name: Publish original news hourly

on:
  schedule:
    - cron: '5 * * * *' # UTC؛ قد يتأخر التشغيل من GitHub
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-press-news-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4.1-mini
      NEWS_MAX_AGE_HOURS: '24'
      MAX_ARTICLES_PER_CATEGORY: '2'
      MAX_TOTAL_ARTICLES: '40'

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser requests

      - name: Check API key and editorial script
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "Missing Actions secret: OPENAI_API_KEY" >&2
            exit 1
          fi

          python - <<'PY'
          import ast
          from pathlib import Path
          import sys

          path = Path("fetch_news.py")
          if not path.is_file():
              sys.exit("fetch_news.py is missing")

          source = path.read_text(encoding="utf-8")
          required = ("OPENAI_API_KEY", "api.openai.com")
          missing = [marker for marker in required if marker not in source]
          if missing:
              sys.exit(
                  "fetch_news.py is not configured for OpenAI editorial writing; "
                  "missing: " + ", ".join(missing)
              )

          ast.parse(source, filename=str(path))
          print("Editorial script syntax and OpenAI integration checks passed.")
          PY

      - name: Generate eligible articles
        run: python fetch_news.py

      - name: Stage generated files safely
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import subprocess
          from pathlib import Path
          import re

          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).decode("utf-8").split("\0")

          generated = {
              path for path in tracked
              if path in {"news-data.json", "news-state.json"}
              or path.startswith("news-images/")
              or re.fullmatch(r"(article|news)-ar_[^/]+\.html", path)
          }

          for pattern in ("article-ar_*.html", "news-ar_*.html"):
              generated.update(path.as_posix() for path in Path(".").glob(pattern))

          image_dir = Path("news-images")
          if image_dir.exists():
              generated.update(
                  path.as_posix()
                  for path in image_dir.rglob("*")
                  if path.is_file()
              )

          if generated:
              subprocess.run(
                  ["git", "add", "-A", "--", *sorted(generated)],
                  check=True,
              )
          else:
              print("No generated article files found.")
          PY

      - name: Commit and push updates
        shell: bash
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "No new eligible articles to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish original source-linked news"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

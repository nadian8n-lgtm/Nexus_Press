name: Prepare hourly news drafts for editorial review

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-press-news-drafts
  cancel-in-progress: false

jobs:
  prepare-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4.1-mini
      NEWS_MAX_AGE_HOURS: '36'
      MAX_DRAFTS_PER_CATEGORY: '2'
      DRAFT_OUTPUT_DIR: /tmp/nexus-press-drafts
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser requests

      - name: Check required files and secret
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "Missing Actions secret: OPENAI_API_KEY" >&2
            exit 1
          fi

          test -f fetch_news.py
          test -f editorial_guard.py
          test -f news-state.json

      - name: Check Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          for filename in ("fetch_news.py", "editorial_guard.py"):
              ast.parse(Path(filename).read_text(encoding="utf-8"), filename=filename)
              print(f"Syntax OK: {filename}")
          PY

      - name: Generate drafts and review checklist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DRAFT_OUTPUT_DIR"
          python fetch_news.py
          python editorial_guard.py

      - name: Ensure public website files were not changed
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import subprocess
          import sys

          result = subprocess.run(
              ["git", "status", "--porcelain", "--untracked-files=all"],
              check=True,
              capture_output=True,
              text=True,
          )

          unexpected = []
          for line in result.stdout.splitlines():
              path = line[3:] if len(line) >= 4 else line
              if path != "news-state.json":
                  unexpected.append(line)

          if unexpected:
              print("Unexpected repository changes; stopping:", file=sys.stderr)
              print("\n".join(unexpected), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Save deduplication state
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- news-state.json

          if git diff --cached --quiet; then
            echo "No deduplication state changes."
            exit 0
          fi

          git commit -m "Update editorial draft discovery state"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload drafts for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-press-editorial-review-${{ github.run_number }}
          path: /tmp/nexus-press-drafts/
          if-no-files-found: warn
          retention-days: 7

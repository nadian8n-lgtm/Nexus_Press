name: Publish Nexus Press news

on:
  workflow_dispatch:
  schedule:
    - cron: '5 * * * *' # مرة كل ساعة، بتوقيت UTC

permissions:
  contents: write

concurrency:
  group: nexus-press-news-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4.1-mini
      NEWS_MAX_AGE_HOURS: '48'
      MAX_ARTICLES_PER_CATEGORY: '6'
      MAX_TOTAL_ARTICLES: '100'
      GENERATE_AI_IMAGES: 'true'
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install publisher dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser requests

      - name: Validate secret and Python syntax
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "Missing Actions secret OPENAI_API_KEY." >&2
            echo "Add it under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

          python -B - <<'PY'
          import ast
          from pathlib import Path

          script = Path("fetch_news.py")
          if not script.is_file():
              raise SystemExit("Required file fetch_news.py was not found.")

          ast.parse(script.read_text(encoding="utf-8"), filename=str(script))
          print("fetch_news.py syntax is valid.")
          PY

      - name: Generate articles and illustrations
        run: python -B fetch_news.py

      - name: Validate generated article data and files
        shell: bash
        run: |
          set -euo pipefail

          python -B - <<'PY'
          import json
          from pathlib import Path

          data_file = Path("news-data.json")
          if not data_file.is_file():
              raise SystemExit("news-data.json was not found.")

          articles = json.loads(data_file.read_text(encoding="utf-8"))
          if not isinstance(articles, list):
              raise SystemExit("news-data.json must contain a JSON array.")

          seen_urls = set()

          for number, article in enumerate(articles, start=1):
              if not isinstance(article, dict):
                  raise SystemExit(f"Article {number} is not a JSON object.")

              for required in ("title", "category", "url", "image"):
                  if not article.get(required):
                      raise SystemExit(
                          f"Article {number} is missing the required field: {required}"
                      )

              if article["url"] in seen_urls:
                  raise SystemExit(f"Duplicate article URL: {article['url']}")
              seen_urls.add(article["url"])

              for field in ("url", "image"):
                  value = article[field]
                  if value.startswith("./"):
                      target = Path(value[2:])
                      if not target.is_file():
                          raise SystemExit(
                              f"Article {number} points to a missing {field}: {value}"
                          )

          print(f"Validated {len(articles)} articles and their local files.")
          PY

      - name: Stage site content, excluding Python cache files
        shell: bash
        run: |
          set -euo pipefail

          git add -A -- . \
            ':(exclude)**/__pycache__/**' \
            ':(exclude)**/*.pyc' \
            ':(exclude)**/*.pyo'

      - name: Commit and publish changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "No new eligible stories. Existing articles are unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Publish source-linked articles and illustrations"
          git pull --rebase origin main
          git push origin HEAD:main

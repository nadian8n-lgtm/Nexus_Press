name: Publish original news hourly

on:
  # UTC. GitHub may delay scheduled starts; this is not guaranteed to run exactly on the hour.
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-press-news-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4.1-mini
      NEWS_MAX_AGE_HOURS: '24'
      MAX_ARTICLES_PER_CATEGORY: '2'
      MAX_TOTAL_ARTICLES: '40'

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser requests

      - name: Validate secret and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "Missing repository Actions secret OPENAI_API_KEY" >&2
            exit 1
          fi
          python -m py_compile fetch_news.py

      - name: Collect, edit, and publish eligible news
        run: python fetch_news.py

      - name: Commit and push published articles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- news-data.json news-state.json article-ar_*.html news-images/
          if git diff --cached --quiet; then
            echo "No new eligible stories to publish."
            exit 0
          fi
          git commit -m "Publish original source-linked news"
          git push origin HEAD:main

name: Nexus Press Auto Publisher

on:
  schedule:
    - cron: '0 * * * *' # Exécution automatique au début de chaque heure
  workflow_dispatch: # Activation du bouton bleu de lancement manuel dans l'onglet Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0 # Historique complet pour éviter les erreurs de rebase lors du push

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        pip install feedparser requests

    - name: Run Robot Journalist
      run: |
        SCRIPT_PATH=$(find . -name "*fetch_news*.py" | head -n 1)
        python "$SCRIPT_PATH"

    - name: Commit and Push Updates
      run: |
        git config --global user.name "NexusPress-Bot"
        git config --global user.email "bot@nexuspress.com"
        
        git add .
        git diff-index --quiet HEAD || git commit -m "Mise à jour automatique : Publication des articles et rafraîchissement des widgets"
        
        git pull --rebase origin main
        git push origin main
